{% extends 'admin/base.html' %}{% block c %}<div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><h2 class="sec m-0">Notes</h2><a class="btn btn-brand" href="{{ url_for('a_edit',key='notes') }}"><i class="bi bi-plus-lg"></i> New note</a></div>
<form class="mb-3 d-flex gap-2"><input class="form-control" name="q" value="{{ q }}" placeholder="Search notes"><button class="btn btn-brand"><i class="bi bi-search"></i></button></form>
{% for n in items %}<div class="box mb-3"><div class="d-flex justify-content-between gap-2"><div><h5 class="mb-0"><i class="bi bi-journal-text acc"></i> {{ n.title or 'Untitled' }}</h5><small class="text-muted">{{ n.updated.strftime('%d %b %Y, %H:%M') if n.updated }}</small></div>
<div class="text-nowrap"><a class="btn btn-sm btn-outline-info" href="{{ url_for('a_edit',key='notes',id=n.id) }}"><i class="bi bi-pencil"></i></a>
<form method="post" action="{{ url_for('a_del',key='notes',id=n.id) }}" class="d-inline" onsubmit="return confirm('Delete this note?')"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></div></div>
<p class="mt-3 mb-0" style="white-space:pre-wrap">{{ n.body }}</p></div>
{% else %}<div class="box text-muted">No notes yet. Write one for future reference.</div>{% endfor %}{% endblock %}
