<div class="row g-3 mb-3"><div class="col-md-5"><div class="box"><h6><i class="bi bi-pie-chart acc"></i> Sunday {{ cur.date if cur else '' }}</h6>{% if cur and (cur.present+cur.absent+cur.none) %}<div class="chart-sm"><canvas id="cp"></canvas></div>{% else %}<p class="text-muted mb-0">No attendance recorded yet.</p>{% endif %}</div></div>
<div class="col-md-7"><div class="box"><h6><i class="bi bi-bar-chart acc"></i> Present vs Absent per Sunday</h6>{% if per %}<div class="chart-sm"><canvas id="cb"></canvas></div>{% else %}<p class="text-muted mb-0">No attendance recorded yet.</p>{% endif %}</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script>
const mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim()||'#9fb0c7';Chart.defaults.color=mut;
{% if cur and (cur.present+cur.absent+cur.none) %}new Chart(document.getElementById('cp'),{type:'pie',data:{labels:['Present','Absent','No response'],datasets:[{data:[{{ cur.present }},{{ cur.absent }},{{ cur.none }}],backgroundColor:['#2ec4b6','#ef476f','#6c7a92'],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12}}}}});{% endif %}
{% if per %}const P={{ per|tojson }};new Chart(document.getElementById('cb'),{type:'bar',data:{labels:P.map(x=>x.date.slice(5)),datasets:[{label:'Present',data:P.map(x=>x.present),backgroundColor:'#2ec4b6',maxBarThickness:14},{label:'Absent',data:P.map(x=>x.absent),backgroundColor:'#ef476f',maxBarThickness:14}]},options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{ticks:{font:{size:10}}}},plugins:{legend:{labels:{boxWidth:10}}}}});{% endif %}</script>
