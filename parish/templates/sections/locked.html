<section class="container py-4"><div class="box"><div class="text-center"><i class="bi bi-lock-fill fs-1 acc"></i><h3 class="mt-2"><i class="bi bi-{{ icon }} acc"></i> {{ sec }}</h3>
<p class="text-muted mb-3">This section is for registered members.</p></div>
<div class="alert alert-info"><i class="bi bi-info-circle-fill"></i> <b>Kindly create an account</b> to view this section. If you already have an account, please <b>log in</b>.</div>
<h6 class="mb-3">What you will find here:</h6><div class="row g-3 mb-4">{% for i,t in perks %}<div class="col-sm-6"><i class="bi bi-{{ i }} acc fs-5 me-2"></i>{{ t }}</div>{% endfor %}</div>
<div class="text-center"><a class="btn btn-brand me-2" href="{{ url_for('login') }}"><i class="bi bi-box-arrow-in-right"></i> Login</a><a class="btn btn-outline-info" href="{{ url_for('register') }}"><i class="bi bi-person-plus"></i> Create Account</a></div></div></section>
